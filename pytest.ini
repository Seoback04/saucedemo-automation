[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    critical: marks tests as critical priority
    high: marks tests as high priority
    medium: marks tests as medium priority
    low: marks tests as low priority
    login: marks tests related to login functionality
    checkout: marks tests related to checkout functionality
    inventory: marks tests related to inventory/products functionality
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
timeout = 300
